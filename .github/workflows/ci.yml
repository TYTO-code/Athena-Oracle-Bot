name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token somente leitura: um PR de fork nunca recebe permissão de escrita nem segredos.
permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Testes
        run: pytest -q

      - name: Migrações aplicam do zero
        env:
          ORACULO_DATABASE_URL: sqlite+aiosqlite:///./ci.sqlite3
        run: alembic upgrade head

      - name: Análise estática de segurança (bandit)
        run: |
          pip install bandit
          bandit -q -r src -ll

      - name: Vulnerabilidades conhecidas nas dependências (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Nenhum segredo versionado (TD-001 / RNF-003)
        run: |
          if git ls-files | grep -E '^\.env$|credentials\.json|token\.json'; then
            echo "Arquivo de segredo versionado detectado."
            exit 1
          fi

  # Só builda a imagem (sem push — o deploy no Render/Railway builda o próprio Dockerfile a partir
  # do repositório, ADR-001). Existe pra pegar cedo o que `qualidade` não pega: a base da imagem
  # (python:*-slim) resolvendo as dependências de verdade, não as do Python do runner do CI acima.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem (estágio runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
